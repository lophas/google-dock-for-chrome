name: Package and publish release
on:
  push:
    branches: [main]
    paths: [manifest.json, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: google-dock-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and test
        run: |
          for file in *.js; do node --check "$file"; done
          node scripts/build-style.cjs --check
          node --test tests/*.test.cjs
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          PACKAGE="google-dock-for-chrome-$VERSION"
          mkdir "$PACKAGE"
          cp manifest.json background.js toolbar.js shared.js backup.js dock-style.js content.js dock.css popup.html popup.js options.html options.js pages.css README.md PRIVACY.md LICENSE "$PACKAGE/"
          cp -R icons "$PACKAGE/"
          zip -qr "$PACKAGE.zip" "$PACKAGE"
          (cd "$PACKAGE" && zip -qr "../$PACKAGE-webstore.zip" .)
          cat > release-notes.md <<'NOTES'
          - Fix stale toolbar warnings after switching tabs, navigation and delayed page checks.
          - Clear the warning when the webpage dock confirms it is ready.
          - Keep the explanation in the toolbar tooltip; remove the yellow warning panel from the launcher.

          **Install:** Download the attached ZIP, extract it, then select the extracted folder using **Load unpacked** at `chrome://extensions` with **Developer mode** enabled. Refresh existing website tabs.

          **Update:** Replace your extension files, reload the extension and refresh website tabs. Existing settings are preserved.
          NOTES
          gh release create "$TAG" "$PACKAGE.zip" "$PACKAGE-webstore.zip" --target "$GITHUB_SHA" --title "Google Dock for Chrome $VERSION" --notes-file release-notes.md --latest
