name: Package and publish release
on:
  push:
    branches: [main]
    paths: [manifest.json, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: google-dock-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and test
        run: |
          for file in *.js; do node --check "$file"; done
          node --test tests/*.test.cjs
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$VERSION" != "1.2.0" ]; then exit 0; fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          PACKAGE="google-dock-for-chrome-$VERSION"
          mkdir "$PACKAGE"
          cp manifest.json background.js shared.js backup.js content.js dock.css popup.html popup.js options.html options.js pages.css README.md LICENSE "$PACKAGE/"
          cp -R icons "$PACKAGE/"
          zip -qr "$PACKAGE.zip" "$PACKAGE"
          cat > release-notes.md <<'NOTES'
          - New **Disabled — toolbar only** option alongside Top and Bottom dock modes.
          - In toolbar-only mode, the keyboard shortcut opens the toolbar app launcher.
          - Refreshed feature overview, installation guide and quick start.

          **Install:** Download the attached ZIP, extract it, then select the extracted folder using **Load unpacked** at `chrome://extensions` with **Developer mode** enabled. Refresh existing website tabs.

          **Update:** Replace your extension files, reload the extension and refresh website tabs. Existing settings are preserved.
          NOTES
          gh release create "$TAG" "$PACKAGE.zip" --target "$GITHUB_SHA" --title "Google Dock for Chrome $VERSION" --notes-file release-notes.md --latest
