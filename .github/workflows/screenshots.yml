name: Capture product screenshots
on:
  push:
    branches: [main]
    paths: [scripts/screenshots.cjs, .github/workflows/screenshots.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install screenshot browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture extension UI
        run: node scripts/screenshots.cjs
      - name: Save screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Google Dock product screenshots"
          git push origin HEAD:main
